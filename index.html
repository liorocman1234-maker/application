}

/* ═══════════════════════════════════════════
   LOGIN SCREEN — Quiet Luxury
═══════════════════════════════════════════ */
function LoginScreen({onSignIn}) {
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');

  const handle = async () => {
    setLoading(true); setError('');
    try { await onSignIn(); }
    catch(e) { setError('שגיאה בהתחברות. נסה/י שוב.'); setLoading(false); }
  };

  return (
    <div style={{
      minHeight:'100vh', background:'#f0eeea',
      display:'flex', alignItems:'center', justifyContent:'center',
      direction:'rtl', padding:'24px',
    }}>
      <div style={{width:'100%', maxWidth:380}}>

        {/* Logo */}
        <div style={{
          background:'white', borderRadius:20,
          padding:'10px 16px',
          textAlign:'center', marginBottom:12,
          boxShadow:'0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.05)',
          overflow:'hidden',
        }}>
          <img decoding="async"
            src="https://liorochman.co.il/wp-content/uploads/2026/05/לוגו-1.jpg"
            alt="רוכמן ליאור אימון מנטלי"
            style={{height:260, width:'auto', display:'block', margin:'-60px auto'}}
          />
        </div>

        {/* Login card */}
        <div style={{
          background:'white', borderRadius:20,
          padding:'32px 28px 28px',
          boxShadow:'0 1px 4px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.05)',
        }}>

          {/* Heading */}
          <div style={{textAlign:'center', marginBottom:26}}>
            <p style={{
              fontSize:13, color:'#a09b95', margin:0,
              fontFamily:'Heebo,sans-serif', lineHeight:1.6, fontWeight:400,
            }}>
              התחבר כדי לגשת לנתונים האישיים שלך
            </p>
          </div>

          {/* Google button */}
          <button onClick={handle} disabled={loading} style={{
            width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:10,
            padding:'14px 20px', borderRadius:13,
            border:'1.5px solid rgba(0,0,0,0.1)',
            background:'white', cursor: loading ? 'default' : 'pointer',
            fontFamily:'Heebo,sans-serif', fontSize:15, fontWeight:600, color:'#1a1917',
            boxShadow:'0 1px 3px rgba(0,0,0,0.05)',
            opacity: loading ? 0.65 : 1,
            transition:'border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease',
          }}
          onMouseOver={e=>{ if(!loading){ e.currentTarget.style.borderColor='rgba(0,0,0,0.2)'; e.currentTarget.style.boxShadow='0 4px 16px rgba(0,0,0,0.08)'; e.currentTarget.style.transform='translateY(-1px)'; }}}
          onMouseOut={e=>{ e.currentTarget.style.borderColor='rgba(0,0,0,0.1)'; e.currentTarget.style.boxShadow='0 1px 3px rgba(0,0,0,0.05)'; e.currentTarget.style.transform=''; }}>
            {loading
              ? <div style={{width:20,height:20,border:'2px solid rgba(0,0,0,0.07)',borderTopColor:'#b8923a',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
              : <svg width={20} height={20} viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            }
            {loading ? 'מעביר לגוגל...' : 'המשך עם Google'}
          </button>

          {error && (
            <p style={{marginTop:12, fontSize:12, color:'#c0392b', fontFamily:'Heebo,sans-serif', textAlign:'center', margin:'12px 0 0'}}>{error}</p>
          )}

          <p style={{
            textAlign:'center', fontSize:11, color:'#c8c3be',
            marginTop:20, fontFamily:'Heebo,sans-serif', lineHeight:1.7,
          }}>
            הנתונים שלך מאובטחים ומחוברים לחשבון Google שלך בלבד
          </p>
        </div>

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════ */
function App() {
  const [user,       setUser]       = useState(null);
  const [authReady,  setAuthReady]  = useState(false);
  const [loading,    setLoading]    = useState(false);
  const [notes,      setNotes]      = useState([]);
  const [globalData, setGlobalData] = useState({keyAchievement:'',futureMe:'',futureLetter:'',stressLess:'',stressMore:''});
  const [screen,     setScreen]     = useState('main');
  const [activeId,   setActive]     = useState(null);
  const [showTour,   setShowTour]   = useState(false);
  const saveTimer = useRef(null);

  const active = notes.find(n => n.id === activeId);

  useEffect(() => {
    const unsub = fbAuth.onAuthStateChanged(async u => {
      setUser(u);
      if (u) {
        setLoading(true);
        const data = await getUserData(u.uid);
        if (data) {
          const loaded = (data.notes||[]).map(normalizeNote);
          setNotes(loaded);
          if (loaded.length) _id = Math.max(_id, ...loaded.map(n => n.id));
          setGlobalData({keyAchievement:'',futureMe:'',futureLetter:'',stressLess:'',stressMore:'',...(data.globalData||{})});
        } else {
          setNotes(DEMO.map(normalizeNote));
        }
        setLoading(false);
        if (!localStorage.getItem('petek_tour_done')) {
          setTimeout(() => setShowTour(true), 900);
        }
      } else {
        setNotes([]);
        setGlobalData({keyAchievement:'',futureMe:'',futureLetter:'',stressLess:'',stressMore:''});
        setScreen('main');
      }
      setAuthReady(true);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!user || !authReady || loading) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      setUserData(user.uid, {notes, globalData});
    }, 1500);
    return () => { if(saveTimer.current) clearTimeout(saveTimer.current); };
  }, [notes, globalData]);

  if (!authReady || loading) return <LoadingScreen />;
  if (!user) return <LoginScreen onSignIn={signInWithGoogle} />;

  const persist = (nextNotes, nextGlobal) =>
    setUserData(user.uid, {notes: nextNotes, globalData: nextGlobal ?? globalData})
      .catch(e => console.error('[Firestore] Write failed:', e.code, e.message));

  const handleAdd = () => {
    const n = makeNote();
    const next = [n, ...notes];
    setNotes(next); setActive(n.id); setScreen('edit');
    persist(next);
  };
  const handleEdit = id => { setActive(id); setScreen('edit'); };
  const handleDelete = id => {
    const next = notes.filter(n => n.id !== id);
    setNotes(next);
    persist(next);
  };

  const handleDebrief = noteOrId => {
    if (typeof noteOrId === 'object') {
      const next = notes.map(n => n.id === noteOrId.id ? normalizeNote(noteOrId) : n);
      setNotes(next);
      persist(next);
      setActive(noteOrId.id);
    } else setActive(noteOrId);
    setScreen('debrief');
  };

  const handleSave = updated => {
    const next = notes.map(n => n.id === updated.id ? normalizeNote(updated) : n);
    setNotes(next);
    persist(next);
  };
  const handleFinishDebrief = (id, data) => {
    const next = notes.map(n => n.id === id ? {...n, debrief: data} : n);
    setNotes(next);
    persist(next);
    setScreen('main');
  };
  const handleNew = () => {
    const n = makeNote();
    const next = [n, ...notes];
    setNotes(next); setActive(n.id); setScreen('edit');
    persist(next);
  };
  const handleGlobalSave = data => {
    setGlobalData(data);
    persist(notes, data);
  };

  const handleTourDone = () => {
    setShowTour(false);
    localStorage.setItem('petek_tour_done', '1');
  };

  return (
    <div style={{minHeight:'100vh',direction:'rtl'}}>
      <div className="app-shell" style={{background:'var(--bg)',minHeight:'100%'}}>
        {screen==='main'&&(
          <MainScreen notes={notes} onAdd={handleAdd} onEdit={handleEdit}
            onDebrief={id=>handleDebrief(id)} onDelete={handleDelete}
            globalData={globalData} onGlobalSave={handleGlobalSave}
            onProgress={()=>setScreen('progress')}
            user={user} onLogout={signOutUser}
            onTour={()=>setShowTour(true)}/>
        )}
        {screen==='main'&&showTour&&(
          <OnboardingTour onDone={handleTourDone}/>
        )}
        {screen==='edit'&&active&&(
          <EditNoteScreen note={active} onBack={()=>setScreen('main')}
            onSave={handleSave} onDebrief={handleDebrief} globalData={globalData}/>
        )}
        {screen==='debrief'&&active&&(
          <DebriefScreen note={active} onBack={()=>setScreen('main')}
            onFinish={handleFinishDebrief} onNew={handleNew} globalData={globalData}/>
        )}
        {screen==='progress'&&(
          <ProgressScreen notes={notes} onBack={()=>setScreen('main')}/>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
